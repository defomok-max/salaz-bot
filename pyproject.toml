[project]
name = "instagram-dork-bot"
version = "0.2.0"
description = "Telegram bot that finds Instagram sale listings via Google Dorks (Serper.dev)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "instagram-dork-bot contributors" }]
dependencies = [
    "aiogram>=3.4.0,<4",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]

[project.scripts]
instagram-dork-bot = "instagram_dork_bot.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "PL"]
# RUF001/002/003: Cyrillic letters look like Latin -- bot UI text is in Russian,
# this is intentional. PLR0913/PLR0911/PLR0912/PLR0915/PLR2004: tunable thresholds
# we don't enforce. PLC0415: occasional lazy imports for CLI entrypoints.
# RUF022: __all__ is curated for public API ergonomics, not alphabetised.
ignore = [
    "PLR0913",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF022",
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
